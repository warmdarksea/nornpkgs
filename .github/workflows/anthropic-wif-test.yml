# Smoke test for the Claude workload identity federation: fetch the job's
# GitHub OIDC token, exchange it for an Anthropic access token under the
# federation rule, then probe the Messages API with it. Never runs on its
# own; start it by hand:
#
#   gh workflow run anthropic-wif-test.yml
#
# The ids below are identifiers, not credentials. The rule's match conditions
# (subject, repository, actor_id) decide whether the exchange succeeds; on a
# 401 the reason is in the Console under Workload identity -> history.
name: anthropic-wif-test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
            // the claims the federation rule matches against
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            for (const k of ['sub', 'aud', 'repository', 'repository_id', 'repository_owner',
                             'repository_owner_id', 'actor', 'actor_id', 'ref', 'event_name',
                             'job_workflow_ref']) {
              core.info(`${k} = ${claims[k]}`);
            }

      - name: Exchange for an Anthropic access token
        run: |
          resp=$(curl -sS --fail-with-body https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_012jriT8dRYtjzKV3hZTzN83",
            "organization_id": "4620bbeb-5071-42f9-b9fd-8fafb663a617",
            "service_account_id": "svac_01CzCqkam6rWF5tWzKfF4P7i",
            "workspace_id": "wrkspc_01RTpknaC1EDYttZ5oiH8LLM"
          }
          JSON
          ) || { echo "exchange failed:"; echo "$resp"; exit 1; }
          token=$(jq -r .access_token <<<"$resp")
          echo "::add-mask::$token"
          jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)' <<<"$resp"
          echo "ACCESS_TOKEN=$token" >> "$GITHUB_ENV"

      # Is inference actually allowed for this service account, and does it
      # depend on the model or on the request's worst-case cost? Each probe is
      # a few tokens; only the status and the error text are printed.
      - name: Probe the Messages API with the federated token
        run: |
          probe() {
            printf '== %-18s max_tokens=%-6s beta=%-45s HTTP ' "$1" "$2" "${3:--}"
            curl -sS -o body.json -w '%{http_code}\n' https://api.anthropic.com/v1/messages \
              -H "authorization: Bearer $ACCESS_TOKEN" \
              -H "anthropic-version: 2023-06-01" \
              -H "content-type: application/json" \
              -H "anthropic-beta: ${3:-}" \
              -d "{\"model\":\"$1\",\"max_tokens\":$2,\"messages\":[{\"role\":\"user\",\"content\":\"Reply with OK\"}]}"
            jq -c '{type, error, request_id, usage, text: (.content[0].text // null)}' body.json
          }
          probe claude-haiku-5-5  16
          probe claude-sonnet-5-5 16
          probe claude-opus-5-5   16
          probe claude-opus-5-5   32000
          # what Claude Code adds to its requests under federation (headers seen in
          # the CLI binary): which of them makes the API say "Credit balance is too low"?
          probe claude-opus-5-5   16    oidc-federation-2026-04-01
          probe claude-opus-5-5   16    oauth-2025-04-20
          probe claude-opus-5-5   16    oauth-2025-04-20,oidc-federation-2026-04-01
          probe claude-opus-5-5   16    context-1m-2025-08-07
          probe claude-opus-5-5   16    oauth-2025-04-20,oidc-federation-2026-04-01,context-1m-2025-08-07,prompt-caching-scope-2026-01-05
          probe claude-sonnet-5-5 16    oauth-2025-04-20,oidc-federation-2026-04-01
          # the rest of what Claude Code puts in a request: streaming, adaptive
          # thinking with effort, bigger output budgets, metadata, a cached system
          # prompt. raw() takes a whole body.
          raw() {
            printf '== %-32s HTTP ' "$1"
            curl -sS -o body.json -w '%{http_code}\n' https://api.anthropic.com/v1/messages \
              -H "authorization: Bearer $ACCESS_TOKEN" \
              -H "anthropic-version: 2023-06-01" \
              -H "content-type: application/json" \
              -H "anthropic-beta: oauth-2025-04-20,oidc-federation-2026-04-01" \
              -d "$2"
            head -c 300 body.json | tr '\n' ' '; echo
          }
          M='"messages":[{"role":"user","content":"Reply with OK"}]'
          raw 'opus max_tokens 64000'       '{"model":"claude-opus-5-5","max_tokens":64000,'"$M"'}'
          raw 'opus max_tokens 128000'      '{"model":"claude-opus-5-5","max_tokens":128000,'"$M"'}'
          raw 'opus stream'                 '{"model":"claude-opus-5-5","max_tokens":16,"stream":true,'"$M"'}'
          raw 'opus thinking adaptive high' '{"model":"claude-opus-5-5","max_tokens":4000,"thinking":{"type":"adaptive"},"output_config":{"effort":"high"},'"$M"'}'
          raw 'opus metadata.user_id'       '{"model":"claude-opus-5-5","max_tokens":16,"metadata":{"user_id":"probe"},'"$M"'}'
          raw 'opus cached system prompt'   '{"model":"claude-opus-5-5","max_tokens":16,"system":[{"type":"text","text":"You are a probe.","cache_control":{"type":"ephemeral"}}],'"$M"'}'
          # Claude Code identifies itself with x-app and a claude-cli User-Agent.
          # If the API bills "Claude Code traffic" against the Claude Code
          # workspace's policy instead of the token's workspace, these fail.
          ident() {
            printf '== %-32s HTTP ' "$1"; shift
            curl -sS -o body.json -w '%{http_code}\n' https://api.anthropic.com/v1/messages \
              -H "authorization: Bearer $ACCESS_TOKEN" \
              -H "anthropic-version: 2023-06-01" \
              -H "content-type: application/json" \
              "$@" \
              -d '{"model":"claude-opus-5-5","max_tokens":16,"messages":[{"role":"user","content":"Reply with OK"}]}'
            head -c 300 body.json | tr '\n' ' '; echo
          }
          UA='claude-cli/2.1.314 (external, claude-code-github-action, agent-sdk/0.3.314)'
          ident 'x-app: cli'                     -H 'x-app: cli'
          ident 'claude-cli user-agent'          -A "$UA"
          ident 'x-app + user-agent'             -H 'x-app: cli' -A "$UA"
          ident 'x-app + UA + federation betas'  -H 'x-app: cli' -A "$UA" -H 'anthropic-beta: oauth-2025-04-20,oidc-federation-2026-04-01'
          ident 'x-app + UA, sonnet'             -H 'x-app: cli' -A "$UA" -d '{"model":"claude-sonnet-5-5","max_tokens":16,"messages":[{"role":"user","content":"Reply with OK"}]}'
