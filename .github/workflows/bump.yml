# A nixpkgs bump a week, as a pull request CI has to pass. `make bump` picks
# the newest nixos-unstable revision whose expensive packages the binary caches
# have (bin/nixpkgs_maximize_cache.sh, lib/bigpkgs.nix), the new lock lands on
# a bump-<date>-<nonce> branch with a PR against master, and the push runs the
# test workflow as any push does. When that run fails, the second job hands the
# PR to Claude Code with the failed run: Claude fixes the configuration and
# pushes to the branch, every push runs the tests again, every failure comes
# back here, at most BUMP_FIX_ATTEMPTS times per PR. Nothing merges; a green
# bump PR is the owner's to merge. Every run that changes the lock gets a new
# branch and PR; earlier bump PRs are left as they are.
#
#   schedule, dispatch      -> bump: make bump, branch, push, PR
#   workflow_run of test    -> fix:  a failed run of a bump-* branch goes to Claude
#
# The branch is pushed and the PR opened with BUMP_TOKEN, a fine-grained
# personal access token of the owner for this repository (Contents and Pull
# requests, read and write), not the job's own token: a push or a PR made with
# the job's token starts no workflow and counts as a stranger's, so its test
# runs had to be dispatched by hand, never showed on the PR, and every
# pull_request workflow on it waited for approval. The Claude step runs on the
# same secret, environment and arguments as claude.yml, with a prompt instead
# of an @claude mention.
name: bump

on:
  schedule:
    - cron: '0 6 * * 1'   # mondays, 06:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: NIX_BUMP_DAYS; 0 updates every input unconditionally
        type: string
        default: "7"
  workflow_run:
    workflows: [test]
    types: [completed]

permissions:
  contents: read

env:
  BUMP_FIX_ATTEMPTS: "3"

jobs:
  bump:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # the push and the PR go through BUMP_TOKEN, the job's own token does nothing
    permissions:
      contents: read
    env:
      NIX_BUMP_DAYS: ${{ inputs.days || '7' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BUMP_TOKEN }}

      - uses: cachix/install-nix-action@v31
        with:
          # trust the flake's nixConfig (cache.nixos-cuda.org)
          extra_nix_config: |
            accept-flake-config = true

      - name: make bump
        id: bump
        run: |
          before=$(jq -r '.nodes[.nodes.root.inputs.nixpkgs].locked.rev' flake.lock)
          # the picker's table and nix's "Updated input" lines, for the PR
          make bump 2> >(tee bump.log >&2)
          after=$(jq -r '.nodes[.nodes.root.inputs.nixpkgs].locked.rev' flake.lock)
          echo "after=$after" >> "$GITHUB_OUTPUT"
          if git diff --quiet flake.lock; then
            echo "flake.lock unchanged ($before), nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "nixpkgs ${before:0:11} -> ${after:0:11}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: branch, commit, pull request, tests
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
          AFTER: ${{ steps.bump.outputs.after }}
        run: |
          # a fresh branch every run, bump-<date>-<6 hex>: nothing is looked up
          # or reused, earlier bump PRs are left as they are
          branch=bump-$(date -u +%F)-$(openssl rand -hex 3)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git commit -q -m "flake: bump nixpkgs to ${AFTER:0:11}" -m "$(cat bump.log)" flake.lock
          git push -u origin "$branch"
          {
            echo "\`make bump\` with NIX_BUMP_DAYS=$NIX_BUMP_DAYS, nixpkgs $AFTER."
            echo
            echo '```'
            cat bump.log
            echo '```'
            echo
            echo "A failed test run of this branch hands it to Claude (bump.yml)."
          } > pr-body.md
          gh pr create --base master --head "$branch" \
            --title "flake: bump nixpkgs to ${AFTER:0:11}" --body-file pr-body.md

  fix:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'bump-') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # one Claude at a time per bump branch; a second failure queues behind it
    concurrency:
      group: bump-fix-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write   # the action's GitHub App authentication
      actions: read     # lets Claude read the test workflow's results
    env:
      # as in claude.yml
      NIXPKGS_ALLOW_UNFREE: "1"
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
      BASH_DEFAULT_TIMEOUT_MS: "600000"
      BASH_MAX_TIMEOUT_MS: "3600000"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 1

      # skip a failure the branch has already moved past (Claude pushed since,
      # or the other arch's run is what counts now), and stop after
      # BUMP_FIX_ATTEMPTS; the attempts are counted from this job's own PR
      # comments, so the owner can see them and reset by deleting them
      - name: still the branch head, attempts left
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          echo "go=false" >> "$GITHUB_OUTPUT"
          if [ "$(git rev-parse HEAD)" != "$RUN_SHA" ]; then
            echo "run $RUN_URL is for $RUN_SHA, the branch is at $(git rev-parse HEAD): stale"; exit 0
          fi
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then echo "no open pull request for $BRANCH"; exit 0; fi
          attempts=$(gh pr view "$pr" --json comments --jq '[.comments[].body | select(startswith("bump: fix attempt"))] | length')
          if [ "$attempts" -ge "$BUMP_FIX_ATTEMPTS" ]; then
            gh pr comment "$pr" --body "bump: out of fix attempts ($BUMP_FIX_ATTEMPTS) after $RUN_URL; this one is yours."
            exit 0
          fi
          gh pr comment "$pr" --body "bump: fix attempt $((attempts + 1)) of $BUMP_FIX_ATTEMPTS, after the failed run $RUN_URL"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "go=true" >> "$GITHUB_OUTPUT"

      - uses: cachix/install-nix-action@v31
        if: steps.gate.outputs.go == 'true'
        with:
          extra_nix_config: |
            accept-flake-config = true

      - uses: DeterminateSystems/magic-nix-cache-action@v15
        if: steps.gate.outputs.go == 'true' && vars.NIX_GHA_CACHE == 'true'
        timeout-minutes: 5
        continue-on-error: true
        with:
          use-gha-cache: true
          use-flakehub: false
          diagnostic-endpoint: ""

      - name: sandbox dependencies for the subprocess env scrub
        if: steps.gate.outputs.go == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - uses: anthropics/claude-code-action@v1
        if: steps.gate.outputs.go == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            You are on branch ${{ github.event.workflow_run.head_branch }}, the
            nixpkgs bump of pull request #${{ steps.gate.outputs.pr }} against
            master. Its test workflow run failed:
            ${{ github.event.workflow_run.html_url }}

            Read that run's logs with `gh run view --log-failed` first and
            decide which of two cases this is before changing anything.

            This repository's configuration no longer fits the new nixpkgs: a
            renamed or removed option, a changed default, a package that is
            now unfree or insecure, a module of ours that needs a small
            adjustment. Fix that: the smallest change in lib/, sys/, home/ or
            hw/ that makes `make test` pass on both runners (CLAUDE.md says
            how to evaluate and test here: make ci_eval, make ci_test_vm and
            friends). An insecure package is permitted by its exact
            name-version, as sys/hell does for zotero. Commit each fix on its
            own, as in `git log`, and push to this branch after every commit;
            each push runs the tests again and this job comes back if they
            fail.

            nixpkgs itself is broken at this revision: a package fails to
            build inside nixpkgs, an upstream module is broken, a test VM
            does not boot for reasons outside this repository. Do not fix
            that. No overlays or overrides that patch or pin nixpkgs
            packages, no second nixpkgs input, no dropping a package or a
            service to get green, no disabling, skipping or loosening a test,
            no retrying the same run hoping it flakes. Leave one PR comment
            that names the revision and the failing derivation or module and
            says the bump should wait, then stop: the next weekly bump lands
            on another revision, and that is the fix.

            When a configuration fix would need a decision from the owner
            (which of two options, whether a package stays), stop and ask in
            a PR comment instead of guessing. Never change flake.lock other
            than by `make bump`, never edit anything under .github/workflows,
            never touch secret/ or the inst/ disk settings.
          # fewer turns than claude.yml: a bump fix is small or it is not ours to make
          claude_args: |
            --model claude-opus-5-5
            --effort high
            --max-turns 120
            --allowedTools "Edit,MultiEdit,Write,Bash,WebSearch,WebFetch"
