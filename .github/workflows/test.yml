# `make test`'s targets, one step each, on a runner of each arch, against
# the public inputs plus gensokyo-private's `ci` branch (gensokyo.ci = true:
# no CUDA group, no large packages, no dev docs -- see lib/ci.nix and
# home/common.nix). which hosts boot and which templates build on each arch
# is the Makefile's NIX_HOSTS_<arch> and NIX_TEMPLATES_<arch>.
#
#   on push:  test-amd64, test-aarch64     make test, a step per target
#   by hand:  any target against the ci copy, on one arch:
#               gh workflow run test.yml -f make='test_vm VM_TARGETS=hell'
#               gh workflow run test.yml -f make='check TARGET=library'
#               gh workflow run test.yml -f arch=aarch64 -f make='eval TARGET=littledevil-prod'
#
# the runner has ~14 GB free; a desktop closure needs the disk-space step.
# in ci mode the generic systems are hell 12 GB, furnace 7 GB (4.6 GB of it
# the uncached vector build), library 3 GB, 16 GB for all three together, so
# the step's df decides whether one runner boots them all.
# kvm is opened to the nix build users before nix is installed, and nix is
# told to offer it to builds; without it qemu emulates.
name: test

on:
  push:
  workflow_dispatch:
    inputs:
      arch:
        description: runner arch
        type: choice
        default: amd64
        options:
          - amd64
          - aarch64
      make:
        description: Makefile target and variables, run as `make ci_<make>`
        type: string
        default: test_vm

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: false

jobs:
  test:
    name: test-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(github.event_name == 'push' && '["amd64", "aarch64"]' || format('["{0}"]', inputs.arch)) }}
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /

      - name: open /dev/kvm to the nix build users
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            ls -l /dev/kvm
          else
            echo "no /dev/kvm; qemu will emulate"
          fi

      - uses: cachix/install-nix-action@v31
        with:
          # trust the flake's nixConfig (cache.nixos-cuda.org)
          extra_nix_config: |
            accept-flake-config = true
            system-features = nixos-test benchmark big-parallel kvm

      # GitHub Actions cache for what this job builds (runner-only; the hosts
      # pull from cache1). Opt-in through the NIX_GHA_CACHE repository variable
      # (Settings -> Secrets and variables -> Actions -> Variables, value true),
      # because over the account's cache egress allowance the action hangs
      # instead of degrading: at start-up, or in its post step after the build
      # succeeded. The timeout bounds a hang and continue-on-error keeps it from
      # failing the job; whether the timeout also covers the post step is
      # unverified, so if that hangs, unset the variable.
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        if: vars.NIX_GHA_CACHE == 'true'
        timeout-minutes: 5
        continue-on-error: true
        with:
          use-gha-cache: true
          use-flakehub: false
          diagnostic-endpoint: ""

      # make test, one step per target so the job page says which one failed.
      # the cheap ones run even after an earlier failure; the VMs and the
      # templates only when everything before them passed
      - name: make test_nix_lint
        if: github.event_name == 'push'
        run: make test_nix_lint

      - name: make ci_test_tf
        if: github.event_name == 'push' && !cancelled()
        run: make ci_test_tf

      - name: make ci_test_nix_check
        if: github.event_name == 'push' && !cancelled()
        run: make ci_test_nix_check

      - name: make ci_test_vm
        if: github.event_name == 'push'
        run: make ci_test_vm

      - name: make ci_test_templates
        if: github.event_name == 'push'
        run: make ci_test_templates

      - name: make ci_${{ inputs.make }}
        if: github.event_name == 'workflow_dispatch'
        env:
          MAKE: ${{ inputs.make }}
        run: eval make "ci_$MAKE"
