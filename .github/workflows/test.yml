# the Makefile's test targets against the public inputs plus gensokyo-private's
# `ci` branch (the ci_* targets), on push; on dispatch, one system's VM.
# the VM tests run on a host of the check's system, hence the arm64 job.
# kvm is opened to the nix build users before nix is installed, and nix is
# told to offer it to builds; without it qemu emulates.
name: test

on:
  push:
  workflow_dispatch:
    inputs:
      vm:
        description: generic system to boot in a VM (checks.<system>.boot-<host>)
        type: choice
        default: base
        options:
          - base
          - abandonedfactory
          - cheese
          - chireiden
          - dusk
          - furnace
          - hell
          - library
          - magic
          - mausoleum
          - sea
          - littledevil

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}-${{ inputs.vm || 'push' }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'push' || inputs.vm != 'littledevil'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /

      - name: open /dev/kvm to the nix build users
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            system-features = nixos-test benchmark big-parallel kvm

      # the same opt-in GitHub Actions cache as build.yml
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        if: vars.NIX_GHA_CACHE == 'true'
        timeout-minutes: 5
        continue-on-error: true
        with:
          use-gha-cache: true
          use-flakehub: false
          diagnostic-endpoint: ""

      - name: nix syntax, terraform
        if: github.event_name == 'push'
        run: make test_nix_lint ci_test_tf

      - name: evaluate every flake output
        if: github.event_name == 'push'
        run: make ci_test_nix_check

      # the small systems; a desktop closure is several GB, one per dispatch
      - name: boot in VMs
        run: make ci_test_vm VM_TARGETS="${{ inputs.vm || 'base abandonedfactory' }}"

      - name: templates
        if: github.event_name == 'push'
        run: make ci_test_templates TEMPLATES="py-hello rust-hello lean4-hello"

  test-aarch64:
    if: github.event_name == 'push' || inputs.vm == 'littledevil'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: open /dev/kvm to the nix build users
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            ls -l /dev/kvm
          else
            echo "no /dev/kvm; qemu will emulate"
          fi

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            system-features = nixos-test benchmark big-parallel kvm

      - uses: DeterminateSystems/magic-nix-cache-action@v15
        if: vars.NIX_GHA_CACHE == 'true'
        timeout-minutes: 5
        continue-on-error: true
        with:
          use-gha-cache: true
          use-flakehub: false
          diagnostic-endpoint: ""

      - name: boot littledevil in a VM
        run: make ci_test_vm VM_TARGETS=littledevil
