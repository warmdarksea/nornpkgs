# Claude Code on issues and pull requests: mention @claude in an issue (title
# or body when opening it, or any later comment), a PR comment, or a PR
# review, and Claude works in a checkout on the runner, pushes to a
# claude/... branch (or the PR's branch) and reports in a comment. It does
# not open PRs itself; for an issue it leaves a "create PR" link.
#
# Who can trigger it: the repository owner (the job's if:), re-checked by
# the action's own write-access test before Claude starts.
#
# Billing: the owner's Claude Max plan, through a token from `claude
# setup-token` in the CLAUDE_CODE_OAUTH_TOKEN secret. The token can only
# make model requests (no claude.ai sessions or connectors), expires after
# a year, and is scrubbed from the environment of every command Claude runs
# (CLAUDE_CODE_SUBPROCESS_ENV_SCRUB). Not workload identity federation: the
# plan's promotional API credit does not cover Claude Code, which this
# action counts as, so a federated service-account token gets 400 "Credit
# balance is too low" (anthropic-wif-test.yml, 2026-10-30). Purchased
# credit would work with the federation inputs instead.
#
# Nix is installed so Claude can evaluate and build; CLAUDE.md tells it how.
# No magic-nix-cache here: with the account over its Actions-cache egress
# limit the action hangs at startup (run 41124231785), and the only cost of
# going without is slower nix builds inside the run.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Two gates before a runner even starts: who, and whether @claude was said.
    # Only the repository owner: github.actor is whoever caused the event (the
    # commenter, the reviewer, the issue author or assigner). GitHub has no
    # custom roles on a personal repository, so this is the wheel group. Two
    # more layers sit behind it: the action re-checks write access, and only
    # the owner can start a run with the CLAUDE_CODE_OAUTH_TOKEN secret at all.
    if: |
      github.actor == github.repository_owner &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # one run at a time per issue or PR; a second mention queues behind the first
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write   # the action's GitHub App authentication
      actions: read     # lets Claude read the build workflow's results on a PR
    env:
      # same as build.yml: the hosts' private modules allow their unfree
      # packages, the ci stub does not
      NIXPKGS_ALLOW_UNFREE: "1"
      # scrub CLAUDE_CODE_OAUTH_TOKEN and the GitHub token from the environment
      # of the commands Claude runs, so a prompt-injected `echo $...` gets nothing
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: cachix/install-nix-action@v31
        with:
          # trust the flake's nixConfig (cache.nixos-cuda.org)
          extra_nix_config: |
            accept-flake-config = true

      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB runs the commands Claude executes inside
      # a bubblewrap sandbox. The runner image lacks bubblewrap and socat, and
      # Ubuntu 24.04 blocks unprivileged user namespaces, which the sandbox
      # needs; without all three Claude Code refuses to start or Bash fails.
      # Same recipe as the action uses when it installs these itself.
      - name: sandbox dependencies for the subprocess env scrub
        run: |
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - uses: anthropics/claude-code-action@v1
        with:
          # a `claude setup-token` token: Claude Max plan usage, model requests only
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude reads only the owner's comments and its own: a stranger's text in
          # a thread you @claude is never in its context
          include_comments_by_actor: warmdarksea,claude[bot]
          additional_permissions: |
            actions: read
          # With the env scrub on, Claude Code forces permission mode "default", so
          # the action's acceptEdits auto-approval of edits in the checkout no longer
          # applies; allow the edit tools explicitly, scoped to the checkout (./**).
          # Bash is off by default; the action itself allows git add/commit/rm
          # and its push wrapper. nix and make are what this repo is driven
          # with, the read-only git commands let Claude see what it changed.
          # Pinned: without --model the action ran Sonnet 5.5 (runs 41139710070,
          # 41140266129), not the plan's Opus 5.5 default. Opus is twice Sonnet
          # per token (API-rate equivalent, drawn from the Max plan's usage
          # windows); the smoke-test runs were $0.09-0.13 on Sonnet. Opus 5.5
          # defaults to medium effort, so set it too.
          claude_args: |
            --model claude-opus-5-5
            --effort high
            --max-turns 60
            --allowedTools "Edit(./**),MultiEdit(./**),Write(./**),Bash(nix:*),Bash(make:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
