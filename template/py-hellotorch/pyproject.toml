[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-hellotorch"
version = "0.1.0"
description = "Runs a few simple torch ops on the GPU"
requires-python = ">=3.10"
dependencies = ["torch"]

[project.scripts]
py-hellotorch = "py_hellotorch:main"

[tool.hatch.build.targets.wheel]
packages = ["py_hellotorch"]
